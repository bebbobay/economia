id?()=>{if(S.txs.some(t=>t.acc==id||t.acc2==id))return toast("Ha movimenti: eliminali prima")||false;S.accounts=S.accounts.filter(x=>x.id!=id);upd()}:null)}

if(!v.name.trim())return false;const p=Math.min(Math.max(parseInt(v.pos)||pos,1),id?n:n+1)-1,o=id?c:{id:uid()};o.name=v.name.trim();if(id)S.cdcs.splice(S.cdcs.indexOf(c),1);S.cdcs.splice(p,0,o);upd()},
id?()=>{if(S.txs.some(t=>t.cdc==id||t.cdc2==id))return toast("Ha movimenti: eliminali prima")||false;S.cdcs=S.cdcs.filter(x=>x.id!=id);upd()}:null)}
function setReal(id,v){S.accounts.find(x=>x.id==id).real=v===""?null:parseFloat(v);upd()}
function backup(){ask("Backup dati",[{k:"j",l:"Copia questo testo per salvarlo. Incolla un backup e premi Importa per ripristinarlo.",t:"area",v:JSON.stringify(S)}],v=>{
try{const x=JSON.parse(v.j);if(!x.accounts||!x.cdcs||!x.txs)throw 0;S=x;S.plans=S.plans||[];S.pm=S.pm||{};upd();toast("Dati importati")}catch(e){toast("Backup non valido");return false}},null,"Importa")}

function act(kd,acc,cdc){return S.txs.reduce((s,t)=>{if(!t.date.startsWith(pmo))return s;if(kd=="out")return t.type=="out"&&t.acc==acc&&t.cdc==cdc?s+t.amt:s;if(t.type!="tr"||t.acc!=acc||t.acc2!=acc)return s;if(t.cdc=="_"&&t.cdc2==cdc)return s+t.amt;if(t.cdc==cdc&&t.cdc2=="_")return s-t.amt;return s},0)}

if(!v.url||!v.anon||!v.email||!v.pw)return toast("Compila tutti i campi")||false;SY.url=v.url.trim();SY.anon=v.anon.trim();SY.base=null;sySave();
(async()=>{try{await syLogin(v.email.trim(),v.pw);syShow("⟳ collegato");sync();render()}catch(e){toast("Accesso non riuscito");syShow("non collegato")}})()},null,"Collega")}
function syOut(){SY={url:SY.url,anon:SY.anon};sySave();syShow("non collegato");render()}
/*END*/
let st="m";
function go(t){tab=t;if(t=="i")pk="alloc";if(t=="o")pk="out";render();window.scrollTo(0,0)}
function applyTheme(){S.theme?document.documentElement.setAttribute("data-theme",S.theme):document.documentElement.removeAttribute("data-theme")}
function cdcHist(id){F={t:[],a:[],c:[id],from:"",to:"",min:"",max:"",q:"",open:true};flt="";tab="s";st="m";render();window.scrollTo(0,0)}
function snav(){return `<div class="row" style="flex-wrap:wrap;margin:10px 0">${[["m","Storico"],["c","Conti"],["d","Cdc"],["b","Altro"]].map(x=>`<button class="b ${st==x[0]?"":"g "}sm" onclick="st='${x[0]}';render()">${x[1]}</button>`).join("")}</div>`}
function setHtml(){const th=(v,t)=>`<button class="b ${(S.theme||"")==v?"":"g "}sm" onclick="S.theme='${v}';applyTheme();upd()">${t}</button>`;
return `<h2>Aspetto</h2><div class="row">${th("","Automatico")}${th("light","Chiaro")}${th("dark","Scuro")}</div><h2>Dati</h2><div class="card"><span class="mu" style="margin-bottom:8px">Copia o ripristina tutti i dati.</span><button class="b sm" onclick="backup()">Backup / Ripristina</button></div>${syHtml()}`}
function txRow(t){const N=x=>nm(S.accounts,x),s=t.type=="in"?1:t.type=="out"?-1:0,w=t.type=="in"?N(t.acc):t.type=="out"?N(t.acc)+" · "+nc(t.cdc):t.type=="tr"?`${N(t.acc)} · ${nc(t.cdc)} → ${N(t.acc2)} · ${nc(t.cdc2)}`:`${N(t.acc)} · ${nc(t.cdc)} ⇄ ${N(t.acc2)} · ${nc(t.cdc2)}`;
return `<div class="li" onclick="editTx('${t.id}')"><span>${esc(t.desc||LAB[ty2(t)])}<small>${t.date} · ${LAB[ty2(t)]} · ${esc(w)}</small></span><b class="${s<0?"ng":s>0?"ok":""}">${s<0?"−":s>0?"+":""}${E(t.amt)}</b></div>`}
function render(){const k=calc();let h="";const T=tab=="s"?st:tab=="i"||tab=="o"?"p":tab;
if(T=="r"){
h=`<div class="card"><span class="mu">Totale sui conti</span><div class="big">${E(k.ta)}</div><div class="two"><div><span class="mu">Allocato ai cdc</span><b>${E(k.ta-k.tf)}</b></div><div><span class="mu">Libero</span><b class="${k.tf<-.005?"ng":""}">${E(k.tf)}</b></div></div></div><h2>Conti</h2>`
+S.accounts.map(a=>`<div class="card row2" style="border-left:8px solid ${a.color||"#ddd"}"><div><b>${esc(a.name)}</b><span class="mu">Saldo</span></div><div style="text-align:right"><b>${E(k.a[a.id])}</b><span class="${k.f[a.id]<-.005?"ng":"mu"}">Libero ${E(k.f[a.id])}</span></div></div>`).join("")
+`<h2>Ultimi movimenti</h2>`+(S.txs.slice().reverse().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(txRow).join("")||'<p class="mu">Ancora nessun movimento.</p>')+`<button class="b g sm" onclick="tab='s';st='m';render()">Vedi tutto lo storico</button>`+`<h2>Centri di costo</h2><span class="mu" style="margin-bottom:6px">Tocca un cdc per vederne i movimenti</span>`+S.cdcs.map(d=>{const v=S.accounts.map(x=>k.c[K(x.id,d.id)]||0),t=v.reduce((p,q)=>p+q,0);
return `<div class="li" onclick="cdcHist('${d.id}')"><span>${esc(d.name)}<span class="ch">${S.accounts.map((x,i)=>`<i class="${v[i]<-.005?"n":""}" style="background:${x.color||"#ddd"}">${E(v[i])}</i>`).join("")}</span></span><b class="${t<-.005?"ng":""}">${E(t)}</b></div>`}).join("")}
else if(T=="m"){
const N=x=>nm(S.accounts,x),l=S.txs.slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(fok),sI=l.reduce((s,t)=>t.type=="in"?s+t.amt:s,0),sO=l.reduce((s,t)=>t.type=="out"?s+t.amt:s,0),nf=F.t.length+F.a.length+F.c.length+["from","to","min","max","q"].filter(x=>F[x]!=="").length+(flt?1:0);
const ch=(k,v,t,st)=>`<button class="b ${F[k].includes(v)?"":"g "}sm" onclick="tg('${k}','${v}')"${st?` style="${st}"`:""}>${esc(t)}</button>`;
h=`<h2>Storico</h2><details ${F.open?"open":""} ontoggle="F.open=this.open" class="card"><summary><b>Filtri${nf?` (${nf} attivi)`:""}</b></summary><div style="margin-top:10px"><label>Mese<input type="month" value="${flt}" onchange="flt=this.value;render()"></label>`
+`<label>Tipo</label><div class="ch2">${Object.entries(LAB).map(x=>ch("t",x[0],x[1])).join("")}</div>`
+`<label>Conti</label><div class="ch2">${S.accounts.map(a=>ch("a",a.id,a.name,"border-left:6px solid "+(a.color||"#ddd"))).join("")}</div>`
+`<label>Centri di costo</label><div class="ch2 sc">${S.cdcs.map(d=>ch("c",d.id,d.name)).join("")}</div>`
+`<div class="two2"><label>Da data<input type="date" value="${F.from}" onchange="F.from=this.value;render()"></label><label>A data<input type="date" value="${F.to}" onchange="F.to=this.value;render()"></label></div>`
+`<div class="two2"><label>Importo minimo<input type="number" step="0.01" value="${F.min}" onchange="F.min=this.value;render()"></label><label>Importo massimo<input type="number" step="0.01" value="${F.max}" onchange="F.max=this.value;render()"></label></div>`
+`<label>Descrizione contiene<input value="${esc(F.q)}" onchange="F.q=this.value;render()"></label><button class="b g sm" onclick="F={t:[],a:[],c:[],from:'',to:'',min:'',max:'',q:'',open:true};flt='';render()">Azzera filtri</button></div></details>`
+`<p class="mu">${l.length} movimenti · Entrate ${E(sI)} · Uscite ${E(sO)}</p>`
+(l.map(t=>{const s=t.type=="in"?1:t.type=="out"?-1:0,w=t.type=="in"?N(t.acc):t.type=="out"?N(t.acc)+" · "+nc(t.cdc):t.type=="tr"?`${N(t.acc)} · ${nc(t.cdc)} → ${N(t.acc2)} · ${nc(t.cdc2)}`:`${N(t.acc)} · ${nc(t.cdc)} ⇄ ${N(t.acc2)} · ${nc(t.cdc2)}`;
return `<div class="li" onclick="editTx('${t.id}')"><span>${esc(t.desc||LAB[ty2(t)])}<small>${t.date} · ${LAB[ty2(t)]} · ${esc(w)}</small></span><b class="${s<0?"ng":s>0?"ok":""}">${s<0?"−":s>0?"+":""}${E(t.amt)}</b></div>`}).join("")||'<p class="mu">Nessun movimento corrisponde ai filtri.</p>')}
else if(T=="b"){h=setHtml()}
else if(T=="p"){h=prevHtml(k)}
else if(T=="c"){h=`<h2>Conti</h2><button class="b sm" onclick="accForm()">+ Nuovo conto</button><div style="height:10px"></div>`+S.accounts.map(a=>{const r=a.real,df=r==null?null:r-k.a[a.id];
return `<div class="card" style="border-left:8px solid ${a.color||"#ddd"}"><div class="row2"><div><b>${esc(a.name)}</b><span class="mu">Saldo iniziale ${E(a.open)}</span></div><div style="text-align:right"><b>${E(k.a[a.id])}</b><button class="b g sm" onclick="mva('${a.id}',-1)">▲</button><button class="b g sm" onclick="mva('${a.id}',1)">▼</button><button class="b g sm" onclick="accForm('${a.id}')">Modifica</button></div></div><div class="vb"><span class="mu">Verifica con la banca €</span><input type="number" step="0.01" value="${r??""}" onchange="setReal('${a.id}',this.value)">${df==null?"":Math.abs(df)>.005?`<span class="ng">differenza ${E(df)}</span>`:'<span class="ok">quadra ✓</span>'}</div></div>`}).join("")}
else{h=`<h2>Centri di costo</h2><button class="b sm" onclick="cdcForm()">+ Nuovo centro di costo</button><div style="height:10px"></div>`+S.cdcs.map((d,i)=>`<div class="li" onclick="cdcForm('${d.id}')"><span style="min-width:24px;color:var(--mu)">${i+1}</span><span style="flex:1">${esc(d.name)}</span><b>${E(S.accounts.reduce((s,x)=>s+(k.c[K(x.id,d.id)]||0),0))}</b><span class="row" style="margin:0"><button class="b g sm" onclick="event.stopPropagation();mvc('${d.id}',-1)">▲</button><button class="b g sm" onclick="event.stopPropagation();mvc('${d.id}',1)">▼</button></span></div>`).join("")}
if(tab=="s")h=snav()+h;
$("m").innerHTML=h;
$("nav").innerHTML=[["r","Riepilogo"],["i","In"],["o","Out"],["s","Impostazioni"]].map(x=>`<button class="${tab==x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
applyTheme();render();syncInit();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
